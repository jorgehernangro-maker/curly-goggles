<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Los 4 bloques de tu dinero · Jorge Hernán-Gómez Rodríguez</title>
<meta name="description" content="Descubre en qué bloque estás y cuál es tu siguiente paso para dejar de improvisar con tu dinero.">
<meta name="theme-color" content="#3D4A1F">
<meta property="og:title" content="¿En qué bloque estás?">
<meta property="og:description" content="El sistema para dejar de improvisar con tu dinero, en 4 bloques. Haz el test y descubre tu siguiente paso.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --olive: #3D4A1F; --olive-2: #56652E; --sage: #76884E; --gold: #C9A84C; --gold-dark: #7E6322; --bronze: #5E4B1C;
  --cream: #F5F3EE; --cream-2: #EEE8D9; --paper: #FFFFFD; --line: #DFD8C6;
  --ink: #1E2314; --ink-2: #4A4C3E; --ink-3: #75766A;
  --b1: #3D4A1F; --b2: #52632D; --b3: #66793C; --b4: #7A8E4F; --stripe-c: #E8DFC8; --red: #A8372B;
  --r: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--cream); color: var(--ink); font-family: "Inter", system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2.5px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }

.wrap { max-width: 640px; margin: 0 auto; padding: 0 20px 64px; }

/* ── cabecera y pasos ── */
.top { position: sticky; top: 0; z-index: 10; background: var(--cream); padding: calc(env(safe-area-inset-top, 0px) + 14px) 0 12px; border-bottom: 1px solid var(--line); }
.top-inner { max-width: 640px; margin: 0 auto; padding: 0 20px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.brand b { color: var(--olive); font-weight: 700; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stp { display: flex; flex-direction: column; gap: 6px; text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink-3); padding: 0; }
.stp i { display: block; height: 4px; border-radius: 4px; background: var(--line); }
.stp span { display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stp svg { width: 11px; height: 11px; flex: 0 0 auto; }
.stp.done i { background: var(--olive-2); }
.stp.on i { background: var(--olive); }
.stp.on { color: var(--olive); }
.stp.done { color: var(--ink-2); }
.stp:disabled { cursor: default; opacity: 0.75; }

.screen { padding-top: 28px; }
h1 { font-size: clamp(30px, 8vw, 44px); line-height: 1.06; font-weight: 800; letter-spacing: -0.025em; color: var(--olive); text-wrap: balance; }
h2 { font-size: clamp(25px, 6.4vw, 34px); line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; color: var(--olive); text-wrap: balance; }
.lead { font-size: 17px; color: var(--ink-2); margin-top: 14px; max-width: 34em; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 0 26px; border-radius: 999px; background: var(--olive); color: var(--cream); font-size: 16px; font-weight: 700; text-decoration: none; transition: transform .12s ease, background .2s ease; }
.btn:active { transform: scale(0.98); }
.btn.gold { background: var(--gold); color: var(--olive); }
.btn.ghost { background: transparent; color: var(--olive); box-shadow: inset 0 0 0 2px var(--olive); }
.btn.block { width: 100%; }
.btn svg { width: 22px; height: 22px; fill: currentColor; flex: 0 0 auto; }
.link { background: none; color: var(--olive); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; font-size: 15px; padding: 6px 0; }

/* ── la torre ── */
.tower { display: flex; flex-direction: column-reverse; gap: 6px; margin: 30px 0 0; }
.blk { --c: var(--b1); position: relative; display: block; width: 100%; text-align: left; border-radius: 12px; padding: 14px 16px; background: var(--c); color: var(--cream); transition: transform .25s ease, box-shadow .25s ease, opacity .25s ease; }
.blk[data-b="2"] { --c: var(--b2); }
.blk[data-b="3"] { --c: var(--b3); }
.blk[data-b="4"] { --c: var(--b4); }
.blk .bn { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.blk .bn b { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
.blk .bn small { font-size: 12.5px; font-weight: 600; opacity: 0.85; }
.blk .bd { font-size: 13.5px; font-weight: 500; opacity: 0.9; margin-top: 2px; }
/* los bloques se estrechan hacia arriba: la base es la que sostiene */
.tower .blk[data-b="2"] { width: 92%; margin: 0 auto; }
.tower .blk[data-b="3"] { width: 84%; margin: 0 auto; }
.tower .blk[data-b="4"] { width: 76%; margin: 0 auto; }
.blk.base { padding-bottom: 12px; }
.comps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 12px; }
.comp { background: rgba(245, 243, 238, 0.14); border-radius: 8px; padding: 8px 9px; font-size: 12px; font-weight: 600; line-height: 1.25; }
.tower.pick .blk { cursor: pointer; }
.tower.pick .blk.sel { box-shadow: 0 0 0 3px var(--cream), 0 0 0 5.5px var(--olive); }
.tower.pick .blk .bd { opacity: .9; }
.ground { height: 3px; background: var(--ink); opacity: .85; border-radius: 3px; margin-top: 6px; }
.tower-cap { font-size: 13px; color: var(--ink-3); margin-top: 10px; font-weight: 500; }

.anim .blk { opacity: 0; transform: translateY(18px); animation: rise .5s cubic-bezier(.2,.8,.2,1) forwards; }
.anim .blk[data-b="1"] { animation-delay: .1s; }
.anim .blk[data-b="2"] { animation-delay: .32s; }
.anim .blk[data-b="3"] { animation-delay: .54s; }
.anim .blk[data-b="4"] { animation-delay: .76s; }
@keyframes rise { to { opacity: 1; transform: none; } }

.details { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
.detail { scroll-margin-top: 120px; transition: box-shadow .3s ease; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; border-left: 5px solid var(--dc, var(--olive)); }
.detail.main { padding: 22px; border-left-width: 7px; }
.detail.main h3 { font-size: 23px; }
.detail.flash { box-shadow: 0 0 0 3px var(--gold); }
.detail h3 { font-size: 20px; font-weight: 800; color: var(--olive); letter-spacing: -0.01em; }
.detail p { color: var(--ink-2); margin-top: 6px; font-size: 15.5px; }
.detail .why { color: var(--ink); }
.detail .why b { color: var(--olive); }
.parts { display: grid; gap: 8px; margin-top: 12px; }
.part { background: var(--cream); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; color: var(--ink-2); }
.part b { color: var(--olive); display: block; font-size: 14.5px; }

.order { margin-top: 30px; }
.order h3 { font-size: 20px; font-weight: 800; color: var(--olive); letter-spacing: -0.01em; }
.order p { color: var(--ink-2); margin-top: 8px; }
.warn { margin-top: 22px; background: var(--olive); color: var(--cream); border-radius: var(--r); padding: 20px; }
.warn p { font-size: 16px; }
.warn b { color: var(--gold); }
.cta-row { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.hint { font-size: 13.5px; color: var(--ink-3); text-align: center; }

/* ── test ── */
.qmeta { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.qcount { font-size: 14px; font-weight: 600; color: var(--ink-3); }
.qblock { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--olive); }
.qblock i { width: 12px; height: 12px; border-radius: 3px; background: var(--qc); }
.mini { display: flex; flex-direction: column-reverse; gap: 3px; width: 54px; }
.mini span { display: block; height: 9px; border-radius: 3px; background: var(--cream-2); box-shadow: inset 0 0 0 1px var(--line); margin: 0 auto; }
.mini span:nth-child(1) { width: 100%; } .mini span:nth-child(2) { width: 90%; } .mini span:nth-child(3) { width: 80%; } .mini span:nth-child(4) { width: 70%; }
.mini span.f { box-shadow: none; }
.bar { height: 6px; border-radius: 6px; background: var(--cream-2); margin: 16px 0 26px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--olive); border-radius: 6px; transition: width .35s ease; }
.qtext { font-size: clamp(23px, 6vw, 29px); line-height: 1.18; font-weight: 800; letter-spacing: -0.015em; color: var(--ink); text-wrap: balance; }
.qhelp { color: var(--ink-3); margin-top: 8px; font-size: 15px; }
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--paper); border-radius: var(--r); padding: 16px 18px; min-height: 60px; font-size: 16px; font-weight: 600; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); transition: box-shadow .15s ease, background .15s ease; }
.opt .dot { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; }
.opt[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--olive); background: #F7F8F1; }
.opt[aria-pressed="true"] .dot { background: var(--olive); box-shadow: none; }
.opt[aria-pressed="true"] .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cream); }
@media (hover: hover) { .opt:hover { box-shadow: inset 0 0 0 1.5px var(--olive-2); } }
.qnav { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; min-height: 40px; }
.qcard { animation: qin .3s ease; }
@keyframes qin { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

/* ── resultado ── */
.res-kicker { font-size: 15px; font-weight: 600; color: var(--ink-3); }
.res-head { display: flex; align-items: center; gap: 16px; }
.res-num { flex: 0 0 auto; width: 76px; height: 76px; border-radius: 20px; background: var(--c); color: var(--cream); display: grid; place-items: center; font-size: 46px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.res-title { margin-top: 4px; }
.res-tower .blk.todo { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1.5px var(--line); }
.res-tower .blk.todo .comp { background: var(--cream-2); color: var(--ink-3); }
.res-tower .blk.next { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 3px var(--c); }
.res-tower .blk.next.b4 { box-shadow: inset 0 0 0 3px var(--gold); }
.res-tower .blk.next .comp { background: var(--cream); color: var(--ink-2); }
.res-tower .blk.next .state { background: var(--olive); color: var(--cream); }
.res-tower .blk .tick { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,253,.25); margin-right: 7px; vertical-align: -2px; }
.res-tower .blk .tick svg { width: 12px; height: 12px; }
.state { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(245,243,238,.2); white-space: nowrap; }
.blk.todo .state { background: var(--cream-2); color: var(--ink-3); }
.blk.next .state { background: var(--olive); color: var(--cream); }
.alert { margin-top: 18px; border-radius: var(--r); padding: 16px 18px; background: #F6EBD0; color: #4F3F12; font-size: 15px; }
.alert b { color: #3A2E0A; }
/* torre sin base: lo de arriba se tambalea */
.res-tower .blk.ahead { --tilt: -1.8deg; --sx: -6px; transform: rotate(var(--tilt)) translateX(var(--sx)); }
.res-tower .blk.ahead[data-b="3"] { --tilt: 1.7deg; --sx: 8px; }
.res-tower .blk.ahead[data-b="4"] { --tilt: -1.3deg; --sx: -4px; }
.res-tower .blk.ahead .state { background: #A8372B; color: #fff; }
/* hueco entre la base sin cerrar y lo que tiene encima */
.res-tower.risk .blk.next + .blk { margin-bottom: 14px; }
.anim .blk.ahead { animation-name: rise-tilt, wobble; animation-duration: .5s, 1s; animation-timing-function: cubic-bezier(.2,.8,.2,1), ease-in-out; animation-fill-mode: forwards, none; }
.anim .blk.ahead[data-b="2"] { animation-delay: .32s, 1.25s; }
.anim .blk.ahead[data-b="3"] { animation-delay: .54s, 1.3s; }
.anim .blk.ahead[data-b="4"] { animation-delay: .76s, 1.35s; }
@keyframes rise-tilt { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: rotate(var(--tilt)) translateX(var(--sx)); } }
@keyframes wobble {
  0% { transform: rotate(var(--tilt)) translateX(var(--sx)); }
  25% { transform: rotate(calc(var(--tilt) * -1.4)) translateX(calc(var(--sx) * -1)); }
  55% { transform: rotate(calc(var(--tilt) * 1.8)) translateX(var(--sx)); }
  80% { transform: rotate(calc(var(--tilt) * -0.6)) translateX(0); }
  100% { transform: rotate(var(--tilt)) translateX(var(--sx)); }
}
.risk-card { margin-top: 20px; border-radius: 18px; padding: 20px; background: #FBF1EE; box-shadow: inset 0 0 0 1.5px #E7C4BC; }
.risk-card h3 { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: #8C2E23; letter-spacing: -0.01em; line-height: 1.2; }
.risk-card h3 svg { width: 22px; height: 22px; flex: 0 0 auto; }
.risk-card p { color: #4A2A24; font-size: 15.5px; margin-top: 8px; }
.risk-card p b { color: #8C2E23; }
.action { margin-top: 26px; background: var(--paper); border-radius: 18px; padding: 22px 20px; box-shadow: inset 0 0 0 1px var(--line); }
.action h3 { font-size: 22px; font-weight: 800; color: var(--olive); letter-spacing: -0.01em; line-height: 1.2; }
.action .why { color: var(--ink-2); margin-top: 6px; font-size: 15.5px; }
.todo-list { list-style: none; counter-reset: k; margin-top: 18px; display: flex; flex-direction: column; gap: 14px; }
.todo-list li { counter-increment: k; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; }
.todo-list li::before { content: counter(k); width: 34px; height: 34px; border-radius: 10px; background: var(--olive); color: var(--cream); font-weight: 800; display: grid; place-items: center; font-size: 15px; }
.todo-list b { display: block; font-size: 16.5px; color: var(--ink); line-height: 1.3; }
.todo-list span { display: block; font-size: 14.5px; color: var(--ink-2); margin-top: 3px; }
.disc { margin-top: 14px; font-size: 13px; color: var(--ink-3); }
.disc b { color: var(--olive); }
.review { margin-top: 26px; }
.rv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rv-name { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 15px; color: var(--ink); line-height: 1.2; }
.rv-tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips span { background: var(--cream); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; color: var(--olive); }
.action .rv-next { margin-bottom: 8px; }
.review-title { font-size: 20px; font-weight: 800; color: var(--olive); letter-spacing: -0.01em; margin-bottom: 12px; }
.rv { background: var(--paper); border-radius: 14px; padding: 13px 13px 14px; box-shadow: inset 0 0 0 1px var(--line); }
.rv-name i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
.rv-state { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.rv-full .rv-state { background: #E3EEDD; color: #2F5A27; }
.rv-half .rv-state { background: #F6EBD0; color: #6B4A10; }
.rv-ahead .rv-state { background: #F6EBD0; color: #6B3A10; }
.rv-none .rv-state { background: var(--cream-2); color: var(--ink-3); }
.rv-next { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--olive); color: var(--cream); white-space: nowrap; }
.rv.is-next { box-shadow: inset 0 0 0 2px var(--olive); }
.rv li.info svg { color: var(--gold-dark); }
.rv-tip { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--olive); line-height: 1.35; }
.help-line { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14.5px; color: var(--ink-2); }
.help-line .link { font-size: 14.5px; padding: 0; }
.res-tower .blk.half { background: repeating-linear-gradient(-45deg, var(--stripe-c) 0 8px, var(--paper) 8px 16px); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--c); }
.res-tower .blk.next.half { box-shadow: inset 0 0 0 3px var(--c); }
.res-tower .blk.next.half.b4 { box-shadow: inset 0 0 0 3px var(--gold); }
.res-tower .blk.half .bn b, .res-tower .blk.next .bn b { text-shadow: 0 0 6px var(--paper), 0 0 2px var(--paper); }
.res-tower .blk.half .comp { background: rgba(255,255,253,.6); color: var(--ink-2); }
.res-tower .blk.half:not(.next) .state { background: var(--paper); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.rv ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.rv li { display: grid; grid-template-columns: 17px 1fr; gap: 6px; align-items: start; font-size: 13.5px; line-height: 1.35; color: var(--ink-2); }
.rv li svg { width: 16px; height: 16px; margin-top: 1px; }
.rv li.ok svg { color: #3B6E32; }
.rv li.no svg { color: #A8372B; }
.rv-none li { color: var(--ink-2); }
.res-actions { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }

/* ── cierre ── */
.contact { display: flex; flex-direction: column; gap: 14px; margin-top: 28px; }
.ccard { background: var(--paper); border-radius: 18px; padding: 20px; box-shadow: inset 0 0 0 1px var(--line); }
.ccard h3 { font-size: 19px; font-weight: 800; color: var(--olive); letter-spacing: -0.01em; }
.ccard p { color: var(--ink-2); font-size: 15px; margin: 4px 0 16px; }
.ccard h3 + .btn { margin-top: 14px; }
.btn.ig { background: linear-gradient(45deg, #F58529, #DD2A7B 45%, #8134AF 75%, #515BD4); color: #fff; }
.btn.wa { background: #25D366; color: #0B3B1E; }
.me { display: flex; align-items: center; gap: 16px; margin-top: 34px; }
.me span { display: block; }
.me-ig { display: inline-flex; align-items: center; gap: 7px; margin-top: 10px; padding: 7px 14px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--olive); color: var(--olive); font-weight: 700; font-size: 14px; text-decoration: none; }
.me-ig svg { width: 17px; height: 17px; fill: currentColor; }
.me img { width: 72px; height: 72px; border-radius: 16px; object-fit: cover; }
.me b { display: block; color: var(--olive); font-size: 17px; }
.me span { font-size: 14px; color: var(--ink-2); }
.legal { font-size: 12px; color: var(--ink-3); margin-top: 26px; line-height: 1.5; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--cream); padding: 12px 18px; border-radius: 12px; font-size: 14.5px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s ease; max-width: calc(100% - 32px); text-align: center; z-index: 50; }
.toast.on { opacity: 1; transform: translateX(-50%); }


/* ── resultado v6: torre compacta + tarjetas por bloque ── */
.res-sub { margin-top: 10px; font-size: 16px; }
.res-tower.compact { margin-top: 18px; gap: 4px; }
.res-tower.compact .blk { padding: 9px 12px; border-radius: 10px; }
.res-tower.compact .blk .bn b { font-size: 15px; }
.res-tower.compact .blk .bd, .res-tower.compact .comps { display: none !important; }
.res-tower.compact .state { font-size: 11.5px; }
.res-tower.compact + .ground { margin-top: 4px; }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 9px; margin-top: 10px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; }
.legend-row i { width: 16px; height: 16px; border-radius: 4px; display: inline-grid; place-items: center; }
.legend-row i svg { width: 11px; height: 11px; }
.lg-done { background: var(--olive); color: var(--cream); }
.lg-cur { background: var(--paper); box-shadow: inset 0 0 0 2.5px var(--olive); }
.lg-half { background: repeating-linear-gradient(-45deg, #DDD2B6 0 3px, var(--paper) 3px 6px); box-shadow: inset 0 0 0 1px var(--olive-2); }

    if (a.reserva === 'mezclado') steps.push(['Sepáralo en otra cuenta', 'Mezclado con el resto, se gasta sin darte cuenta.']);
    else if (a.reserva !== 'aparte') steps.push(['Dale su propia cuenta', 'Sin tarjeta: así solo se toca si pasa algo.']);
    help = a.gasto === 'no' ? ['¿No sabes por dónde empezar?', 'quiero ordenar mis gastos'] : ['¿Te atascas con algún paso?', 'quiero ayuda para completar mi colchón'];
  } else if (b === 2) {
    // se llega aquí sin cifra y sin aportar cada mes
    steps.push(['Calcula cuánto necesitas', 'Lo que querrás al mes, menos tu pensión estimada.']);
    steps.push(a.aporte === 'aveces' ? ['Automatiza lo que ya aportas', 'Una cantidad fija cada mes, no cuando te acuerdes.'] : ['Empieza a aportar', 'Automático, aunque sea poco. Cada año que esperas, cuesta más.']);
    disc = 'Cifra orientativa: depende de tu pensión y de cuánto rinda lo que aportes.';
    help = ['¿Calculamos tu cifra juntos?', 'quiero calcular cuánto necesito para mi jubilación'];
  } else if (b === 3) {
    if (a.inv !== 'si') steps.push(['Decide para qué y a cuántos años', 'Antes de elegir ningún producto.'], ['Entiende lo que contratas', 'Si no sabes explicarlo, no entres.'], ['Aporta cada mes', 'Mejor que esperar el momento perfecto.']);
    else if (a.seguro === 'no') steps.push(['Organiza tu cartera', 'Haz inventario: qué tienes, por qué y para cuándo.'], ['Mira qué hay dentro', 'Tres fondos distintos pueden ser las mismas empresas.']);
    else steps.push(['Organiza tu cartera', 'Escribe tu estrategia: cuánto aportas, en qué y para cuándo.'], ['Decide qué harás si cae', 'Decídelo en frío, no con miedo.']);
    help = a.inv === 'si' ? ['¿Organizamos tu cartera juntos?', 'quiero organizar mi cartera'] : ['¿Te ayudo a dar el primer paso?', 'quiero empezar a invertir'];
  } else if (b === 4) {
    steps.push(['Ponle cifra a tus rentas', 'Cuánto al mes y en qué plazo.'], ['Calcula el capital que necesitas', 'Y a qué ritmo llegar.']);
    help = ['¿Vemos cuánto capital necesitas?', 'quiero calcular cuánto capital necesito para vivir de rentas'];
  }
  return { steps, disc, help };
}

function diagnose(a) {
  const gastoOk = ['exacto', 'aprox'].includes(a.gasto);
  const colchonOk = ['3', '6'].includes(a.meses);
  const ok = {
    // el ahorro fijo solo hace falta mientras el colchón no está completo
    1: gastoOk && colchonOk && a.reserva === 'aparte',
    2: a.cifra === 'si' || a.aporte === 'auto', // aportar de vez en cuando sin saber cuánto necesitas no lo completa
    3: a.inv === 'si' && a.seguro === 'si',
    4: a.rentas === 'si'
  };
  const prog = {
    1: ok[1] ? 'full' : (gastoOk || a.ahorro === 'fijo' || colchonOk || a.reserva === 'aparte') ? 'half' : 'none',
    2: ok[2] ? 'full' : a.aporte === 'aveces' ? 'half' : 'none',
    3: ok[3] ? 'full' : a.inv === 'si' ? 'half' : 'none',
    4: ok[4] ? 'full' : 'none'
  };
  let level = 0;
  for (const b of [1, 2, 3, 4]) { if (ok[b]) level = b; else break; }
  const next = level < 4 ? level + 1 : null;
  const cur = next || 4; // el bloque en el que estás: el que tienes que trabajar ahora
  const ahead = [2, 3, 4].filter((b) => b > (next || 5) && prog[b] !== 'none');
  const names = ahead.map((b) => BLOCKS[b].name);
  const aheadNames = names.length > 1 ? `${names.slice(0, -1).join(', ')} y ${names[names.length - 1]}` : names.join('');
  // bloques con trabajo: el actual y los que están a medias más arriba
  // tarjetas: el bloque en el que estás y, por encima, los que tienes a medias (no cuentan, pero tienen su siguiente paso)
  const work = next ? [next, ...ahead.filter((b) => prog[b] === 'half')] : [];
  let risk = null;
  if (ahead.length) {
    if (next === 1) risk = { title: 'Tu torre no tiene base', body: `Tienes en marcha ${aheadNames}, pero el bloque 1 sin cerrar. Un imprevisto te obligaría a tocarlo, seguramente en mal momento.` };
    else if (next === 2) risk = { title: 'Te falta el bloque 2 debajo', body: ahead.includes(3)
      ? 'Tienes inversiones, pero no sabes cuánto necesitas para jubilarte. Cuando llegue el momento, tu jubilación se comerá tu crecimiento.'
      : 'Tienes rentas, pero no sabes cuánto necesitas para jubilarte. Acabarás tirando de ellas para cubrir ese hueco.' };
    else risk = { title: 'Te falta el bloque 3 debajo', body: 'Tienes rentas, pero sin una cartera clara que las sostenga.' };
  }
  // aporta pero no sabe cuánto necesita: el bloque cuenta, pero hay que ver cuánto y cómo lo hace
  const jubCheck = ok[2] && a.cifra !== 'si';
  return { ok, prog, level, next, cur, ahead, aheadNames, risk, work, jubCheck };
}

  const states = resultParts(d);
  const date = new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
  return `<div class="s-head"><span><b>Jorge Hernán-Gómez Rodríguez</b><br>El sistema de los 4 bloques</span><span>${nm() ? 'Resultado de ' + esc(nm()) : 'Mi resultado'}, ${date}</span></div>
    <div class="s-grid"><div>${resultTop(d, states, false)}</div>
    <div><h3 class="sec-title" style="margin-top:0">Mis próximos pasos</h3><div class="bcards">${d.work.length ? d.work.map((b) => blockCard(b, d, b === d.cur, true)).join('') : doneCard(true)}</div></div></div>
    <div class="s-foot">
      <div class="s-cta"><b>Cuéntame en qué bloque estás</b>
        <div class="s-btns">
          <a class="sbtn sbtn-ig" href="${igLink(hola(d))}">${ICON_IG}Escribirme por Instagram</a>
          <a class="sbtn sbtn-wa" href="${waLink(`${hola(d)} Me gustaría ver un caso real.`)}">${ICON_WA}Pedir un caso real</a>
        </div>
      </div>
    </div>
    <div class="s-me">
      <img src="${PHOTO}" alt="">
      <div class="s-me-txt"><b>Jorge Hernán-Gómez Rodríguez</b><span>Psicólogo y Consultor Financiero Independiente</span></div>
      <a class="sbtn sbtn-prof" href="${IG_PROFILE}">${ICON_IG}@${IG_USER}</a>
    </div>
    <p class="legal">Contenido educativo e informativo. No constituye asesoramiento en materia de inversión ni recomendación de ningún producto financiero.</p>`;
}

/* ── PDF del resultado: se genera en el navegador y se descarga ── */
const PDF_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
function loadPdfLib() {
  return new Promise((resolve, reject) => {
    if (window.html2pdf) return resolve();
    const sc = document.createElement('script');
    sc.src = PDF_LIB; sc.onload = () => (window.html2pdf ? resolve() : reject()); sc.onerror = reject;
    document.head.appendChild(sc);
  });
}
/** html2canvas no resuelve currentColor ni tamaños por CSS en los SVG: se fijan antes de capturar */
function prepareIcons(sh) {
  const tmp = document.createElement('div');
  tmp.className = 'html2pdf__container';
  tmp.style.cssText = 'position:absolute;left:-10000px;top:0;width:703px';
  const parent = sh.parentNode, next = sh.nextSibling;
  tmp.appendChild(sh); document.body.appendChild(tmp);
  sh.querySelectorAll('svg').forEach((svg) => {
    const r = svg.getBoundingClientRect(), col = getComputedStyle(svg).color;
    svg.setAttribute('width', Math.max(1, Math.round(r.width)));
    svg.setAttribute('height', Math.max(1, Math.round(r.height)));
    if (svg.getAttribute('stroke') === 'currentColor') svg.setAttribute('stroke', col);
    if (!svg.getAttribute('fill') || svg.getAttribute('fill') === 'currentColor') { if (svg.getAttribute('fill') !== 'none') svg.setAttribute('fill', svg.getAttribute('stroke') ? 'none' : col); }
    svg.querySelectorAll('[stroke="currentColor"]').forEach((n) => n.setAttribute('stroke', col));
  });
  parent.insertBefore(sh, next); tmp.remove();
}
async function downloadPdf(btn) {
  if (btn.disabled) return;
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Preparando tu PDF…';
  try {
    await loadPdfLib();
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const sh = $('#sheet');
    sh.innerHTML = sheet();
    prepareIcons(sh);
    const y = window.scrollY; window.scrollTo(0, 0);
    const d = diagnose(S.a);
    await window.html2pdf().set({
      margin: [8, 12, 8, 12],
      filename: `Mi_resultado_bloque_${d.cur}.pdf`,
      image: { type: 'jpeg', quality: 0.96 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false, scrollX: 0, scrollY: 0, windowWidth: Math.round(186 * 96 / 25.4) },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], avoid: ['.bcard', '.risk-card', '.res-tower'] },
      enableLinks: true
    }).from($('#sheet')).save();
    window.scrollTo(0, y);
    toast('Tu PDF se ha descargado');
  } catch (err) {
    // sin conexión o navegador sin soporte: opción de imprimir / guardar como PDF
    window.print();
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

/* ── registro de respuestas (Google Sheets vía Apps Script) ── */
const COLS = { gasto: 'Sabe lo que gasta', ahorro: 'Cómo ahorra', meses: 'Meses de colchón', reserva: 'Dónde está el colchón', aporte: 'Aporta a jubilación', cifra: 'Sabe cuánto necesita', inv: 'Tiene inversiones', seguro: 'Cartera idónea', rentas: 'Tiene rentas' };
const ST_TXT = { done: 'Completo', next: 'Estás aquí', 'next half': 'Estás aquí (a medias)', ahead: 'Sin base', 'ahead half': 'Sin base (a medias)', todo: 'Sin empezar' };
function registro() {
  if (!REGISTRO_URL || !testDone()) return;
  const key = JSON.stringify([S.name, S.a]);
  if (S.sent === key) return; // ya enviado: no se duplica al recargar
  const d = diagnose(S.a), st = resultParts(d);
  const fila = {
    'Nombre / IG': nm() || '(sin nombre)',
    'Bloque': `${d.cur} · ${BLOCKS[d.cur].name}`,
    'Situación': d.level === 4 ? 'Los 4 completos' : d.prog[d.cur] === 'half' ? 'A medias' : 'Sin empezar',
    'Sin base': [1, 2, 3, 4].filter((b) => st[b].startsWith('ahead')).map((b) => BLOCKS[b].name).join(', ') || '—',
    'Revisar jubilación': d.jubCheck ? 'Sí' : 'No'
  };
  for (const b of [1, 2, 3, 4]) fila[BLOCKS[b].name] = ST_TXT[st[b]];
  for (const Q of QUESTIONS) { const o = Q.o.find((x) => x[0] === S.a[Q.id]); fila[COLS[Q.id]] = o ? o[1] : '—'; }
  fila['Origen'] = S.orig || 'Directo';
  fila['Dispositivo'] = matchMedia('(pointer: coarse)').matches ? 'Móvil' : 'Ordenador';
  try {
    fetch(REGISTRO_URL, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fila }) }).catch(() => {});
    S.sent = key;
  } catch (e) {}
}

/* ── render y eventos ── */
const app = $('#app');
function render(scroll = true) {
  if (S.page === 3 && !testDone()) S.page = 2;
  if (S.page === 4 && !(testDone() && S.seen)) S.page = testDone() ? 3 : 2;
  if (S.page === 3) { S.seen = true; registro(); }
  app.innerHTML = [null, page1, page2, page3, page4][S.page]();
  $('#sheet').innerHTML = sheet();
  stepsNav();
  firstPaint = false;
  save();
  if (scroll) window.scrollTo({ top: 0 });
  const g = $('#gate-name');
  document.body.classList.toggle('locked', !!g);
  if (g) setTimeout(() => { try { g.focus({ preventScroll: true }); } catch (e) {} }, 60);
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 3200); }

let advancing = null;
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-go],[data-pick],[data-ans],[data-back],[data-fwd],[data-print],[data-reset],[data-rename],[data-ig]');
  if (!el) return;
  if (el.dataset.go) { const p = Number(el.dataset.go); if (el.disabled) return; S.page = p; render(); return; }
  if (el.dataset.pick) {
    S.sel = Number(el.dataset.pick);
    document.querySelectorAll('[data-pick]').forEach((x) => { const on = Number(x.dataset.pick) === S.sel; x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
    document.querySelectorAll('.tower.anim').forEach((t) => t.classList.remove('anim'));
    const det = $('#det-' + S.sel);
    det.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    document.querySelectorAll('.detail.flash').forEach((x) => x.classList.remove('flash'));
    det.classList.add('flash'); clearTimeout(det._t); det._t = setTimeout(() => det.classList.remove('flash'), 1600);
    return;
  }
  if (el.dataset.ans) {
    const qs = visibleQs(), Q = qs[S.q];
    S.a[Q.id] = el.dataset.ans;
    // si deja de tener inversiones, se borran las preguntas que dependen de ello
    if (Q.id === 'inv' && S.a.inv !== 'si') delete S.a.seguro;
    save();
    document.querySelectorAll('[data-ans]').forEach((x) => x.setAttribute('aria-pressed', x === el));
    clearTimeout(advancing);
    advancing = setTimeout(() => {
      const list = visibleQs();
      if (S.q < list.length - 1) { S.q++; render(false); }
      else { S.page = 3; render(); }
    }, 260);
    return;
  }
  if (el.hasAttribute('data-back')) { clearTimeout(advancing); S.q = Math.max(0, S.q - 1); render(false); return; }
  if (el.hasAttribute('data-fwd')) { S.q++; render(false); return; }
  if (el.hasAttribute('data-print')) { downloadPdf(el); return; }
  if (el.hasAttribute('data-reset')) { S.a = {}; S.q = 0; S.seen = false; S.page = 2; render(); return; }
  if (el.hasAttribute('data-rename')) { S.name = ''; S.a = {}; S.q = 0; S.seen = false; S.page = 2; render(); return; }
  if (el.hasAttribute('data-ig')) {
    const msg = el.dataset.msg || '';
    try { navigator.clipboard && navigator.clipboard.writeText(msg).then(() => toast('Mensaje copiado por si Instagram no lo pega solo.')).catch(() => {}); } catch (err) {}
  }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'gate') return;
  e.preventDefault();
  const inp = $('#gate-name'), v = cleanName(inp.value);
  if (v.length < 2) { inp.setAttribute('aria-invalid', 'true'); $('#gate-err').hidden = false; inp.focus(); return; }
  S.name = v; render(false);
});
document.addEventListener('keydown', (e) => {
  if (S.page !== 2 || !S.name || e.target.closest('input,textarea')) return;
  const n = Number(e.key);
  const opts = document.querySelectorAll('[data-ans]');
  if (n >= 1 && n <= opts.length) opts[n - 1].click();
});

render(false);
})();
</script>
