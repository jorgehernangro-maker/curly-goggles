<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Página no disponible · Jorge Hernán-Gómez Rodríguez</title>
<style>
  :root{
    --olive:#3D4A1F; --gold:#C9A84C; --gold-lt:#E8D49A; --gold-dark:#8B6E28;
    --cream:#F5F3EE; --cream-dk:#EAE7DE; --white:#FAFAF6;
    --ink-mid:#3A3A2E;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", system-ui, sans-serif;background:var(--cream);color:var(--ink-mid);line-height:1.55;-webkit-font-smoothing:antialiased;}
  body{padding:24px 16px;min-height:100vh;}

  .card{max-width:600px;margin:0 auto;background:var(--white);border-radius:18px;overflow:hidden;box-shadow:0 6px 50px rgba(61,74,31,.10);}

  .head{background:var(--olive);padding:36px 40px 32px;text-align:center;}
  .head__tag{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-lt);opacity:.85;margin-bottom:16px;}
  .head__title{font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;font-size:26px;font-weight:900;line-height:1.2;color:var(--white);}

  .body{padding:32px 40px 36px;text-align:center;}
  .body p{font-size:15px;line-height:1.65;}
  .bar{width:40px;height:2px;background:var(--gold);margin:0 auto 22px;}
  .wa{display:inline-block;margin-top:22px;font-size:15px;font-weight:700;color:var(--gold-dark);text-decoration:none;border-bottom:1.5px solid var(--gold);padding-bottom:2px;}
  .wa:hover{color:var(--olive);}

  @media (max-width:480px){
    .head{padding:30px 24px 26px;}
    .body{padding:28px 24px 32px;}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="head__tag">Envío de documentación</div>
      <h1 class="head__title">Esta página no está disponible</h1>
    </div>
    <div class="body">
      <div class="bar"></div>
      <p>Para enviarme documentación, escríbeme por WhatsApp.</p>
      <a class="wa" href="https://wa.me/34699756225">Escribirme por WhatsApp</a>
    </div>
  </div>
</body>
</html>
